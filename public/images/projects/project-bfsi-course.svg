<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9cf8b" />
      <stop offset="100%" stop-color="#c59b27" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#0d1526" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Central LMS Course Card Graphic -->
  <rect x="120" y="70" width="560" height="360" rx="16" fill="url(#cardGrad)" stroke="#c59b27" stroke-width="1.5" opacity="0.9" />
  
  <!-- Header bar inside mockup -->
  <rect x="120" y="70" width="560" height="50" rx="16" fill="#18233a" />
  <circle cx="155" cy="95" r="6" fill="#ef4444" />
  <circle cx="175" cy="95" r="6" fill="#f59e0b" />
  <circle cx="195" cy="95" r="6" fill="#10b981" />
  <text x="230" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">BFSI Compliance Suite — Articulate Storyline 360</text>

  <!-- Interactive Slide Content Mockup -->
  <!-- Left panel: Navigation & modules -->
  <rect x="150" y="145" width="130" height="250" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <rect x="165" y="165" width="100" height="8" rx="4" fill="#c59b27" />
  <rect x="165" y="185" width="80" height="6" rx="3" fill="#334155" />
  <rect x="165" y="205" width="90" height="6" rx="3" fill="#334155" />
  <rect x="165" y="225" width="70" height="6" rx="3" fill="#334155" />
  <rect x="165" y="245" width="85" height="6" rx="3" fill="#334155" />
  <rect x="165" y="265" width="75" height="6" rx="3" fill="#334155" />
  <rect x="165" y="355" width="100" height="24" rx="6" fill="#c59b27" opacity="0.2" stroke="#c59b27" stroke-width="1" />
  <text x="180" y="371" fill="#e9cf8b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">SCORM 2004</text>

  <!-- Main interactive canvas -->
  <rect x="300" y="145" width="350" height="250" rx="8" fill="#080e1a" stroke="#1e293b" stroke-width="1" />
  
  <!-- Scenario Badge -->
  <rect x="325" y="170" width="120" height="22" rx="11" fill="#c59b27" opacity="0.15" />
  <text x="340" y="185" fill="#e9cf8b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">MODULE 02 • KYC / AML</text>

  <!-- Headline -->
  <text x="325" y="225" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Customer Due Diligence Protocol</text>
  <text x="325" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Interactive decision tree simulation with real-time feedback.</text>

  <!-- Action buttons -->
  <rect x="325" y="280" width="150" height="38" rx="6" fill="url(#goldGrad)" />
  <text x="350" y="304" fill="#070b14" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Verify Documentation</text>

  <rect x="490" y="280" width="140" height="38" rx="6" fill="#18233a" stroke="#334155" stroke-width="1" />
  <text x="515" y="304" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Escalate Risk Flag</text>

  <!-- Progress Bar at bottom -->
  <rect x="325" y="355" width="305" height="6" rx="3" fill="#1e293b" />
  <rect x="325" y="355" width="220" height="6" rx="3" fill="url(#goldGrad)" />
  <text x="590" y="345" fill="#c59b27" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">72%</text>
</svg>
