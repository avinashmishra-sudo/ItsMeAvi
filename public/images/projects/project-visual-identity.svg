<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2e4b8" />
      <stop offset="100%" stop-color="#c59b27" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad3)" />

  <!-- Design Grid & Rules -->
  <g opacity="0.1" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4">
    <circle cx="400" cy="250" r="180" fill="none" />
    <circle cx="400" cy="250" r="120" fill="none" />
    <circle cx="400" cy="250" r="60" fill="none" />
    <line x1="100" y1="250" x2="700" y2="250" />
    <line x1="400" y1="50" x2="400" y2="450" />
  </g>

  <!-- Card Palette Previews -->
  <!-- Swatch 1: Navy -->
  <rect x="140" y="140" width="110" height="180" rx="10" fill="#070b14" stroke="#334155" stroke-width="1.5" />
  <rect x="155" y="270" width="80" height="10" rx="5" fill="#f8fafc" />
  <rect x="155" y="290" width="50" height="6" rx="3" fill="#64748b" />
  <text x="155" y="250" fill="#94a3b8" font-family="monospace" font-size="11">#070B14</text>

  <!-- Swatch 2: Gold Accent (Elevated) -->
  <rect x="270" y="110" width="130" height="230" rx="10" fill="url(#goldGrad3)" stroke="#fdfbf4" stroke-width="2" filter="drop-shadow(0 15px 25px rgba(197,155,39,0.3))" />
  <rect x="290" y="280" width="90" height="12" rx="6" fill="#070b14" />
  <rect x="290" y="305" width="60" height="8" rx="4" fill="#5b4019" />
  <text x="290" y="255" fill="#070b14" font-family="monospace" font-size="12" font-weight="bold">#C59B27</text>

  <!-- Swatch 3: Slate White -->
  <rect x="420" y="140" width="110" height="180" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <rect x="435" y="270" width="80" height="10" rx="5" fill="#070b14" />
  <rect x="435" y="290" width="50" height="6" rx="3" fill="#94a3b8" />
  <text x="435" y="250" fill="#475569" font-family="monospace" font-size="11">#F8FAFC</text>

  <!-- Typography Specimen Card -->
  <rect x="550" y="130" width="160" height="200" rx="10" fill="#080e1a" stroke="#c59b27" stroke-width="1" />
  <text x="570" y="175" fill="#e9cf8b" font-family="serif" font-size="34" font-weight="bold">Aa</text>
  <text x="570" y="210" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Editorial Hierarchy</text>
  <rect x="570" y="230" width="120" height="5" rx="2" fill="#334155" />
  <rect x="570" y="245" width="100" height="5" rx="2" fill="#334155" />
  <rect x="570" y="260" width="80" height="5" rx="2" fill="#334155" />
  <rect x="570" y="285" width="120" height="20" rx="4" fill="#c59b27" opacity="0.2" />
  <text x="580" y="299" fill="#e9cf8b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">BRAND GUIDELINE</text>

  <!-- Bottom Label -->
  <text x="400" y="415" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Corporate Brand System • Visual Identity & Typography Tokens</text>
</svg>
