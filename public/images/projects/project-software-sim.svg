<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#deb55b" />
      <stop offset="100%" stop-color="#aa801e" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad2)" />

  <!-- Technical grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Software Application Window Mockup -->
  <rect x="100" y="60" width="600" height="380" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="100" y="60" width="600" height="42" rx="12" fill="#141c2e" />
  <circle cx="130" cy="81" r="5" fill="#ef4444" />
  <circle cx="148" cy="81" r="5" fill="#f59e0b" />
  <circle cx="166" cy="81" r="5" fill="#10b981" />
  <text x="200" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Enterprise Operations Hub • Interactive Simulation Mode</text>

  <!-- Side Navigation in software -->
  <rect x="100" y="102" width="160" height="338" fill="#070b14" />
  <rect x="120" y="130" width="120" height="28" rx="6" fill="#1e293b" />
  <rect x="120" y="170" width="120" height="28" rx="6" fill="#c59b27" opacity="0.15" stroke="#c59b27" stroke-width="1" />
  <rect x="120" y="210" width="120" height="28" rx="6" fill="#141c2e" />
  <rect x="120" y="250" width="120" height="28" rx="6" fill="#141c2e" />

  <!-- Workspace Canvas -->
  <rect x="280" y="125" width="400" height="150" rx="8" fill="#141c2e" stroke="#1e293b" stroke-width="1" />
  <rect x="305" y="150" width="160" height="14" rx="4" fill="#3b82f6" opacity="0.7" />
  <rect x="305" y="175" width="280" height="8" rx="4" fill="#334155" />
  <rect x="305" y="195" width="220" height="8" rx="4" fill="#334155" />
  <rect x="305" y="215" width="250" height="8" rx="4" fill="#334155" />

  <!-- Target Interactive Hotspot with pulse -->
  <circle cx="560" cy="200" r="28" fill="#c59b27" opacity="0.2" />
  <circle cx="560" cy="200" r="14" fill="#c59b27" opacity="0.6" />
  <circle cx="560" cy="200" r="6" fill="#fdfbf4" />
  
  <!-- Step Instruction Card -->
  <rect x="280" y="295" width="400" height="120" rx="8" fill="#080d17" stroke="#c59b27" stroke-width="1" />
  <text x="305" y="325" fill="#e9cf8b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">STEP 3 OF 8 — TASK EXECUTION</text>
  <text x="305" y="355" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Click the highlight to validate transaction batch #482</text>
  <text x="305" y="380" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Interactive feedback triggers on correct mouse click.</text>
</svg>
